<dialog class="p-flyout" data-p-footer-behavior="fixed" aria-label="Flyout" aria-modal="true" tabindex="-1">

    <div class="p-flyout__panel">
      <button type="button" class="p-flyout__dismiss" aria-label="Dismiss flyout"><span>Dismiss flyout</span></button>
      <div>Some Content</div>
      <footer class="p-flyout__footer">

  dialog.focus();
