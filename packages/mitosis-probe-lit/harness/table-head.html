<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lit-table-head harness</title>
    <link rel="stylesheet" href="../../components/projects/stylesheets/lib/variables.css" />
    <style>
      body {
        margin: 16px;
        background: #fff;
      }
      .table {
        display: table;
        --_p-table-c: var(--p-color-contrast-low);
      }
    </style>
  </head>
  <body>
    <div
      id="border-ref"
      style="position: absolute; width: 1px; height: 1px; border-bottom: 1px solid var(--p-color-contrast-low)"
    ></div>
    <section id="default">
      <div class="table">
        <lit-table-head>
          <span>Model</span>
        </lit-table-head>
      </div>
    </section>
    <section id="hidden">
      <div class="table">
        <lit-table-head hidden>
          <span>Hidden</span>
        </lit-table-head>
      </div>
    </section>
    <script src="lit-table-head.bundle.js"></script>
  </body>
</html>
