<div class="playground auto-layout-inline" title="primary label only">
  <p-button variant="primary">Some label</p-button>
  <button type="button" class="p-button"><span class="p-button__label">Some label</span></button>
</div>
<div class="playground auto-layout-inline" title="primary disabled">
  <p-button variant="primary" disabled="true">Some label</p-button>
  <button type="button" class="p-button" disabled><span class="p-button__label">Some label</span></button>
</div>
<div class="playground auto-layout-inline" title="secondary label only">
  <p-button variant="secondary">Some label</p-button>
  <button type="button" class="p-button" data-p-variant="secondary"><span class="p-button__label">Some label</span></button>
</div>
<div class="playground auto-layout-inline" title="destructive label only">
  <p-button variant="destructive">Some label</p-button>
  <button type="button" class="p-button" data-p-variant="destructive"><span class="p-button__label">Some label</span></button>
</div>
<div class="playground auto-layout-inline" title="compact">
  <p-button variant="primary" compact="true">Some label</p-button>
  <button type="button" class="p-button" data-p-compact="true"><span class="p-button__label">Some label</span></button>
</div>
<div class="playground auto-layout-inline" title="primary with icon">
  <p-button variant="primary" icon="arrow-right">Some label</p-button>
  <button type="button" class="p-button" data-p-icon="arrow-right">
    <img class="p-icon p-button__icon" data-p-size="inherit" data-p-color="inherit" src="https://cdn.ui.porsche.com/porsche-design-system/icons/arrow-right.872716b.svg" alt="" width="24" height="24" aria-hidden="true" />
    <span class="p-button__label">Some label</span>
  </button>
</div>
<div class="playground auto-layout-inline" title="primary hide-label">
  <p-button variant="primary" hide-label="true" icon="arrow-right">Some label</p-button>
  <button type="button" class="p-button" data-p-icon="arrow-right" data-p-hide-label="true">
    <img class="p-icon p-button__icon" data-p-size="inherit" data-p-color="inherit" src="https://cdn.ui.porsche.com/porsche-design-system/icons/arrow-right.872716b.svg" alt="" width="24" height="24" aria-hidden="true" />
    <span class="p-button__label">Some label</span>
  </button>
</div>
