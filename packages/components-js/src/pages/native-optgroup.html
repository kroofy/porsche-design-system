<style>
  p-select,
  .p-field {
    width: 20rem;
  }
</style>

<div class="playground auto-layout-inline" title="optgroups">
  <p-select name="options" value="a" label="Some Label">
    <p-optgroup label="Some optgroup label 1">
      <p-select-option value="a">Option A</p-select-option>
      <p-select-option value="b">Option B</p-select-option>
      <p-select-option value="c">Option C</p-select-option>
    </p-optgroup>
    <p-optgroup label="Some optgroup label 2">
      <p-select-option value="d">Option D</p-select-option>
      <p-select-option value="e">Option E</p-select-option>
      <p-select-option value="f">Option F</p-select-option>
    </p-optgroup>
  </p-select>
  <div class="p-field">
    <label class="p-label" for="native-optgroup">Some Label</label>
    <select id="native-optgroup" class="p-select" name="native-optgroup">
      <optgroup class="p-optgroup" label="Some optgroup label 1">
        <option value="a" selected>Option A</option>
        <option value="b">Option B</option>
        <option value="c">Option C</option>
      </optgroup>
      <optgroup class="p-optgroup" label="Some optgroup label 2">
        <option value="d">Option D</option>
        <option value="e">Option E</option>
        <option value="f">Option F</option>
      </optgroup>
    </select>
  </div>
</div>
