<style>
  .custom-size {
    --p-spinner-size: 99px;
  }

  .custom-color {
    --p-spinner-color: deeppink;
    --p-spinner-track-color: lightpink;
  }

  .native-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }
</style>

<div class="playground" title="default">
  <div class="native-pair">
    <p-spinner></p-spinner>
    <svg
      class="p-spinner"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="-16 -16 32 32"
      role="alert"
      aria-live="assertive"
      focusable="false"
    >
      <circle r="11"></circle>
      <circle r="11"></circle>
    </svg>
  </div>
</div>
