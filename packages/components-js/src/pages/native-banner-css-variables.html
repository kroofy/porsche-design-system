<style>
  .p-banner {
    --p-banner-top: 8px;
    --p-banner-bottom: 8px;
    --p-banner-inset-x: 8px;
    --p-banner-max-w: 70ch;
  }
</style>

<div class="visualize-grid">
  <span></span>
  <span></span>
  <span></span>

</div>

<aside
  popover="manual"
  class="p-banner"
  data-p-position="top"
  data-p-position-xs="bottom"
  data-p-position-s="top"
  data-p-position-m="bottom"
  data-p-position-l="top"
  data-p-position-xl="bottom"
  role="status"
  aria-live="polite"
  aria-label="Heading"
>
  <h5>Heading</h5>
  <p>Description</p>
  <button type="button" class="p-banner__dismiss" aria-label="Close banner" aria-description="Heading">
    <span>Close banner</span>
  </button>
</aside>
<p-text hidden>native banner</p-text>
<script>
  const banner = document.querySelector('.p-banner');
  banner.showPopover();
  banner.querySelector('.p-banner__dismiss')?.addEventListener('click', () => banner.hidePopover());
</script>
