<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lit-button-tile harness</title>
    <link rel="stylesheet" href="../../components/projects/stylesheets/lib/variables.css" />
    <style>
      body {
        margin: 16px;
        background: #fff;
      }
      section {
        margin-block: 12px;
        width: 240px;
      }
    </style>
  </head>
  <body>
    <div
      id="primary-ref"
      style="position: absolute; width: 1px; height: 1px; color: var(--p-color-primary); color-scheme: dark"
    ></div>
    <section id="default">
      <lit-button-tile aspect-ratio="3/4" label="Some label" description="Some description">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Some description" />
      </lit-button-tile>
    </section>
    <section id="top">
      <lit-button-tile
        weight="regular"
        size="large"
        gradient="true"
        align="top"
        aspect-ratio="9/16"
        label="Some label"
        description="Some description"
      >
        <p-tag slot="header">Some tag</p-tag>
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Some description" />
        <p-text slot="footer">Some footer</p-text>
      </lit-button-tile>
    </section>
    <section id="compact-json">
      <lit-button-tile
        compact='{"base":false,"m":true}'
        label="Some label"
        description="Some description"
      >
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Some description" />
      </lit-button-tile>
    </section>
    <section id="disabled">
      <lit-button-tile disabled="true" label="Some label" description="Some description">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Some description" />
      </lit-button-tile>
    </section>
    <section id="hidden">
      <lit-button-tile hidden label="Hidden" description="Hidden">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Hidden" />
      </lit-button-tile>
    </section>
    <script src="lit-button-tile.bundle.js"></script>
  </body>
</html>
