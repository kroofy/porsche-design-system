<div class="playground auto-layout-inline" title="default">
  <p-button-pure>Some label</p-button-pure>
  <button type="button" class="p-button-pure">
    <img class="p-icon p-button-pure__icon" data-p-size="inherit" data-p-color="inherit" src="https://cdn.ui.porsche.com/porsche-design-system/icons/arrow-right.872716b.svg" alt="" width="24" height="24" aria-hidden="true" />
    <span class="p-button-pure__label">Some label</span>
  </button>
</div>
<div class="playground auto-layout-inline" title="disabled">

</div>
<div class="playground auto-layout-inline" title="loading">
  <p-button-pure loading="true">Some label</p-button-pure>
  <button type="button" class="p-button-pure" disabled aria-busy="true" data-p-loading="true">
    <span class="p-button-pure__spinner" aria-hidden="true">
      <svg viewBox="-16 -16 32 32" width="100%" height="100%" focusable="false" aria-hidden="true">
        <circle r="11"></circle>
        <circle r="11"></circle>
      </svg>
    </span>
    <span class="p-button-pure__label">Some label</span>
  </button>
</div>
