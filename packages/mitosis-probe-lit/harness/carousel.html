<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lit-carousel harness</title>
    <link rel="stylesheet" href="../../components/projects/stylesheets/lib/variables.css" />
    <style>
      body {
        margin: 16px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <section id="basic">
      <lit-carousel heading="Some heading" description="Some description" pagination="true">
        <div>Slide 1</div>
        <div>Slide 2</div>
        <div>Slide 3</div>
      </lit-carousel>
    </section>
    <section id="slots">
      <lit-carousel slides-per-page="2" pagination="true">
        <h2 slot="heading">Heading</h2>
        <p slot="description">Description</p>
        <div slot="controls">Controls</div>
        <div>Slide 1</div>
        <div>Slide 2</div>
        <div>Slide 3</div>
      </lit-carousel>
    </section>
    <script src="lit-carousel.bundle.js"></script>
  </body>
</html>
