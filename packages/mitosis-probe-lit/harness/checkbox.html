<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lit-checkbox harness</title>
    <link rel="stylesheet" href="../../components/projects/stylesheets/lib/variables.css" />
    <style>
      body {
        margin: 16px;
        background: #fff;
      }
      section {
        margin-block: 12px;
      }
    </style>
    <script src="lit-checkbox.bundle.js"></script>
  </head>
  <body>
    <div
      id="bg-ref"
      style="position: absolute; width: 1px; height: 1px; background: var(--p-color-frosted)"
    ></div>
    <div
      id="checked-ref"
      style="position: absolute; width: 1px; height: 1px; background: var(--p-color-primary)"
    ></div>
    <div
      id="success-ref"
      style="position: absolute; width: 1px; height: 1px; color: var(--p-color-success)"
    ></div>
    <section id="default">
      <lit-checkbox label="Some label" name="some-name"></lit-checkbox>
    </section>
    <section id="checked">
      <lit-checkbox label="Some label" checked="true"></lit-checkbox>
    </section>
    <section id="indeterminate">
      <lit-checkbox label="Some label" indeterminate="true"></lit-checkbox>
    </section>
    <section id="loading">
      <lit-checkbox label="Some label" loading="true"></lit-checkbox>
    </section>
    <section id="disabled">
      <lit-checkbox label="Some label" disabled="true"></lit-checkbox>
    </section>
    <section id="success">
      <lit-checkbox label="Some label" state="success" message="Some message."></lit-checkbox>
    </section>
    <section id="error">
      <lit-checkbox label="Some label" state="error" message="Some message."></lit-checkbox>
    </section>
    <section id="hide-label">
      <lit-checkbox label="Some label" hide-label="true"></lit-checkbox>
    </section>
    <section id="nolabel">
      <lit-checkbox name="some-name"></lit-checkbox>
    </section>
    <section id="hidden">
      <lit-checkbox hidden label="Some label"></lit-checkbox>
    </section>
    <section id="breakpoint">
      <lit-checkbox label="bp" hide-label='{"base":true,"m":false}'></lit-checkbox>
    </section>
  </body>
</html>
