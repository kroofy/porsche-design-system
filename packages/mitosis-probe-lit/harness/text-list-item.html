<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lit-text-list-item harness</title>
    <link rel="stylesheet" href="../../components/projects/stylesheets/lib/variables.css" />
    <style>
      body {
        margin: 16px;
        background: #fff;
      }
      section {
        margin-block: 12px;
      }
    </style>
    <script src="lit-text-list-item.bundle.js"></script>
  </head>
  <body>
    <section id="default">
      <lit-text-list-item>ABC</lit-text-list-item>
    </section>
    <section id="nested">
      <lit-text-list-item>
        ABC
        <span>child</span>
      </lit-text-list-item>
    </section>
    <section id="hidden">
      <lit-text-list-item hidden>ABC</lit-text-list-item>
    </section>
  </body>
</html>
