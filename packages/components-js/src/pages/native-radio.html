<style>
  p-radio-group,
  .p-field {
    width: 20rem;
  }
</style>
<div class="playground auto-layout-inline" title="label">
  <p-radio-group name="some-name" label="Some label" value="b">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
    <p-radio-group-option label="Some label C" value="c"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label">Some label</span>
    <div class="p-radios">
      <div class="p-field">
        <input id="native-radio-a" class="p-radio" type="radio" name="native-radio-label" value="a" />
        <label class="p-label" for="native-radio-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-b" class="p-radio" type="radio" name="native-radio-label" value="b" checked />
        <label class="p-label" for="native-radio-b">Some label B</label>
      </div>
      <div class="p-field">
        <input id="native-radio-c" class="p-radio" type="radio" name="native-radio-label" value="c" />
        <label class="p-label" for="native-radio-c">Some label C</label>
      </div>
    </div>
  </div>
</div>
<div class="playground auto-layout-inline" title="disabled">
  <p-radio-group name="some-name" label="Some label" value="b" disabled="true">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label">Some label</span>
    <div class="p-radios">
      <div class="p-field">
        <input id="native-radio-dis-a" class="p-radio" type="radio" name="native-radio-disabled" value="a" disabled />
        <label class="p-label" for="native-radio-dis-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-dis-b" class="p-radio" type="radio" name="native-radio-disabled" value="b" checked disabled />
        <label class="p-label" for="native-radio-dis-b">Some label B</label>
      </div>
    </div>
  </div>
</div>
<div class="playground auto-layout-inline" title="compact">
  <p-radio-group name="some-name" label="Some label" value="b" compact="true">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label">Some label</span>
    <div class="p-radios" data-p-compact="true">
      <div class="p-field">
        <input id="native-radio-co-a" class="p-radio" type="radio" name="native-radio-compact" value="a" data-p-compact="true" />
        <label class="p-label" for="native-radio-co-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-co-b" class="p-radio" type="radio" name="native-radio-compact" value="b" checked data-p-compact="true" />
        <label class="p-label" for="native-radio-co-b">Some label B</label>
      </div>
    </div>
  </div>
</div>
<div class="playground auto-layout-inline" title="required">
  <p-radio-group name="some-name" label="Some label" value="b" required="true">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label">Some label<span class="p-label__required" aria-hidden="true"> *</span></span>
    <div class="p-radios">
      <div class="p-field">
        <input id="native-radio-req-a" class="p-radio" type="radio" name="native-radio-required" value="a" required />
        <label class="p-label" for="native-radio-req-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-req-b" class="p-radio" type="radio" name="native-radio-required" value="b" checked required />
        <label class="p-label" for="native-radio-req-b">Some label B</label>
      </div>
    </div>
  </div>
</div>
<div class="playground auto-layout-inline" title="error">
  <p-radio-group name="some-name" label="Some label" value="b" state="error" message="Some error">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label">Some label</span>
    <div class="p-radios">
      <div class="p-field">
        <input id="native-radio-err-a" class="p-radio" type="radio" name="native-radio-error" value="a" data-p-state="error" />
        <label class="p-label" for="native-radio-err-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-err-b" class="p-radio" type="radio" name="native-radio-error" value="b" checked data-p-state="error" aria-invalid="true" aria-describedby="native-radio-error-msg" />
        <label class="p-label" for="native-radio-err-b">Some label B</label>
      </div>
    </div>
    <span class="p-message" id="native-radio-error-msg" data-p-state="error">
      <img class="p-icon" data-p-name="exclamation" data-p-color="error" src="https://cdn.ui.porsche.com/porsche-design-system/icons/exclamation.46cd17b.svg" alt="" width="24" height="24" aria-hidden="true" />
      Some error
    </span>
  </div>
</div>
<div class="playground auto-layout-inline" title="success">
  <p-radio-group name="some-name" label="Some label" value="b" state="success" message="Some success">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label">Some label</span>
    <div class="p-radios">
      <div class="p-field">
        <input id="native-radio-ok-a" class="p-radio" type="radio" name="native-radio-success" value="a" data-p-state="success" />
        <label class="p-label" for="native-radio-ok-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-ok-b" class="p-radio" type="radio" name="native-radio-success" value="b" checked data-p-state="success" aria-describedby="native-radio-success-msg" />
        <label class="p-label" for="native-radio-ok-b">Some label B</label>
      </div>
    </div>
    <span class="p-message" id="native-radio-success-msg" data-p-state="success">
      <img class="p-icon" data-p-name="check" data-p-color="success" src="https://cdn.ui.porsche.com/porsche-design-system/icons/check.8ba06be.svg" alt="" width="24" height="24" aria-hidden="true" />
      Some success
    </span>
  </div>
</div>
<div class="playground auto-layout-inline" title="hide-label">
  <p-radio-group name="some-name" label="Some label" hide-label="true" value="b">
    <p-radio-group-option label="Some label A" value="a"></p-radio-group-option>
    <p-radio-group-option label="Some label B" value="b"></p-radio-group-option>
  </p-radio-group>
  <div class="p-field">
    <span class="p-label" data-p-hide-label="true">Some label</span>
    <div class="p-radios">
      <div class="p-field">
        <input id="native-radio-hide-a" class="p-radio" type="radio" name="native-radio-hide" value="a" />
        <label class="p-label" for="native-radio-hide-a">Some label A</label>
      </div>
      <div class="p-field">
        <input id="native-radio-hide-b" class="p-radio" type="radio" name="native-radio-hide" value="b" checked />
        <label class="p-label" for="native-radio-hide-b">Some label B</label>
      </div>
    </div>
  </div>
</div>
