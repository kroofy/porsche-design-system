<style>
  p-textarea,
  .p-field {
    width: 20rem;
  }
</style>
<div class="playground auto-layout-inline" title="label">
  <p-textarea name="some-name" label="Some label"></p-textarea>
  <div class="p-field">
    <label class="p-label" for="native-ta-label">Some label</label>
    <textarea id="native-ta-label" class="p-textarea" name="native-ta-label" rows="7" dir="auto"></textarea>
  </div>
</div>
<div class="playground auto-layout-inline" title="value">
  <p-textarea name="some-name" label="Some label" value="some-value"></p-textarea>
  <div class="p-field">
    <label class="p-label" for="native-ta-value">Some label</label>
    <textarea id="native-ta-value" class="p-textarea" name="native-ta-value" rows="7" dir="auto">some-value</textarea>
  </div>
</div>
<div class="playground auto-layout-inline" title="disabled">
  <p-textarea name="some-name" label="Some label" value="some-value" disabled="true"></p-textarea>
  <div class="p-field">
    <label class="p-label" for="native-ta-disabled">Some label</label>
    <textarea id="native-ta-disabled" class="p-textarea" name="native-ta-disabled" rows="7" disabled dir="auto">some-value</textarea>
  </div>
</div>
<div class="playground auto-layout-inline" title="compact">
  <p-textarea name="some-name" label="Some label" compact="true"></p-textarea>
  <div class="p-field">
    <label class="p-label" for="native-ta-compact">Some label</label>
    <textarea id="native-ta-compact" class="p-textarea" name="native-ta-compact" rows="7" data-p-compact="true" dir="auto"></textarea>
  </div>
</div>
<div class="playground auto-layout-inline" title="error">
  <p-textarea name="some-name" label="Some label" state="error" message="Some error"></p-textarea>
  <div class="p-field">
    <label class="p-label" for="native-ta-error">Some label</label>
    <textarea id="native-ta-error" class="p-textarea" name="native-ta-error" rows="7" data-p-state="error" aria-invalid="true" aria-describedby="native-ta-error-msg" dir="auto"></textarea>
    <span class="p-message" id="native-ta-error-msg" data-p-state="error">
      <img class="p-icon" data-p-name="exclamation" data-p-color="error" src="https://cdn.ui.porsche.com/porsche-design-system/icons/exclamation.46cd17b.svg" alt="" width="24" height="24" aria-hidden="true" />
      Some error
    </span>
  </div>
</div>
