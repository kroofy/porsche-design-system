<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>lit-stepper-horizontal harness</title>
    <link rel="stylesheet" href="../../components/projects/stylesheets/lib/variables.css" />
    <style>
      body {
        margin: 16px;
        background: #fff;
      }
      section {
        margin-block: 12px;
        width: 480px;
      }
    </style>
  </head>
  <body>
    <div
      id="md-ref"
      style="position: absolute; width: 1px; height: 1px; font-size: var(--p-typescale-md)"
    ></div>
    <section id="default">
      <lit-stepper-horizontal>
        <p-stepper-horizontal-item state="current">Enter personal details</p-stepper-horizontal-item>
        <p-stepper-horizontal-item>Confirm e-mail</p-stepper-horizontal-item>
        <p-stepper-horizontal-item>Set password</p-stepper-horizontal-item>
      </lit-stepper-horizontal>
    </section>
    <section id="medium">
      <lit-stepper-horizontal size="medium">
        <p-stepper-horizontal-item state="complete">Step 1</p-stepper-horizontal-item>
        <p-stepper-horizontal-item state="current">Step 2</p-stepper-horizontal-item>
      </lit-stepper-horizontal>
    </section>
    <section id="hide-size">
      <lit-stepper-horizontal size='{"base":"small","m":"medium"}'>
        <p-stepper-horizontal-item state="current">Step 1</p-stepper-horizontal-item>
      </lit-stepper-horizontal>
    </section>
    <section id="hidden">
      <lit-stepper-horizontal hidden>
        <p-stepper-horizontal-item state="current">Step 1</p-stepper-horizontal-item>
      </lit-stepper-horizontal>
    </section>
    <script src="lit-stepper-horizontal.bundle.js"></script>
  </body>
</html>
