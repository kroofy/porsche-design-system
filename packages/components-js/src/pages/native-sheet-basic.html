<dialog class="p-sheet" aria-label="Some Heading" aria-modal="true" tabindex="-1">
  <div class="p-sheet__scroller">
    <div class="p-sheet__panel">
      <button type="button" class="p-sheet__dismiss" aria-label="Dismiss sheet"><span>Dismiss sheet</span></button>
      <header class="p-sheet__header">
        <p-heading size="large" tag="h2">Some Heading</p-heading>
      </header>
      <p-text>Some Content</p-text>
    </div>
  </div>
</dialog>
<script>
  const dialog = document.querySelector('dialog.p-sheet');
  dialog.showModal();
  dialog.focus();
</script>
